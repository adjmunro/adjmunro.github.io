<!DOCTYPE html>
<html lang="en-UK">
<head>
    <meta charset="UTF-8"/>
    <meta name="author" content="Adam Munro"/>
    <meta name="description" content="{{ page.description | default(value=config.description) }}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"/>
    <title>{% block title %}{{ config.title }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ get_url(path="default.css") }}"/>
    <link rel="alternate" type="application/rss+xml" href="{{ get_url(path="rss.xml") }}"/>
</head>
<body>
    {% block content %}{% endblock %}

    <!-- Mermaid.js for diagram rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js"
            integrity="sha384-R63zfMfSwJF4xCR11wXii+QUsbiBIdiDzDbtxia72oGWfkT7WHJfmD/I/eeHPJyT"
            crossorigin="anonymous"></script>

    <!-- Code enhancements: Mermaid initialization and copy buttons -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Convert Mermaid code blocks to diagrams
            document.querySelectorAll('pre code').forEach(block => {
                const text = block.textContent.trim();
                // Check if this is a Mermaid diagram
                if (text.match(/^(flowchart|graph|sequenceDiagram|classDiagram|stateDiagram|erDiagram|gantt|pie|journey|gitGraph)/)) {
                    const mermaidDiv = document.createElement('div');
                    mermaidDiv.className = 'mermaid';
                    mermaidDiv.textContent = text;
                    block.closest('pre').replaceWith(mermaidDiv);
                }
            });

            // Initialize Mermaid with secure configuration
            mermaid.initialize({
                startOnLoad: true,
                theme: 'default',
                securityLevel: 'strict'
            });
            mermaid.run();

            // Add copy buttons to remaining code blocks
            document.querySelectorAll('pre').forEach(pre => {
                // Skip if already has a copy button
                if (pre.querySelector('.copy-button')) return;

                const button = document.createElement('button');
                button.className = 'copy-button';
                button.textContent = 'Copy';
                button.setAttribute('aria-label', 'Copy code to clipboard');

                button.addEventListener('click', async () => {
                    const code = pre.querySelector('code').textContent;
                    try {
                        await navigator.clipboard.writeText(code);
                        button.textContent = 'Copied!';
                        button.classList.add('copied');
                        setTimeout(() => {
                            button.textContent = 'Copy';
                            button.classList.remove('copied');
                        }, 2000);
                    } catch (err) {
                        console.error('Failed to copy:', err);
                        button.textContent = 'Failed';
                        setTimeout(() => {
                            button.textContent = 'Copy';
                        }, 2000);
                    }
                });

                pre.appendChild(button);
            });
        });
    </script>
</body>
</html>
