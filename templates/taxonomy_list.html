{% extends "base.html" %}
{% block title %}Tags | {{ config.title }}{% endblock %}
{% block content %}
<h1>Tags</h1>
<ul>
{% for term in terms %}
    <li>
        <a href="{{ term.permalink }}">{{ term.name }}</a> ({{ term.pages | length }} post{% if term.pages | length > 1 %}s{% endif %})
    </li>
{% endfor %}
</ul>
{% endblock %}
